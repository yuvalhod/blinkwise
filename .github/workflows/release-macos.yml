name: macOS app

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build Blinkwise.app and .dmg
        run: bash packaging/build_macos.sh
      - uses: actions/upload-artifact@v4
        with:
          name: Blinkwise-macos
          path: dist/Blinkwise.dmg
