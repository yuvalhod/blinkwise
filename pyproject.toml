[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "blinkwise"
version = "0.1.0"
description = "A private, on-device webcam coach that tracks blinking, screen habits and breaks."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [{ name = "Blinkwise contributors" }]
keywords = ["eye strain", "blinking", "computer vision syndrome", "dry eye", "20-20-20", "mediapipe", "health"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: End Users/Desktop",
  "License :: OSI Approved :: MIT License",
  "Operating System :: MacOS",
  "Operating System :: Microsoft :: Windows",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Image Recognition",
]
dependencies = [
  "numpy>=1.23",
  "mediapipe>=0.10.14",
  "screeninfo>=0.8",
  "psutil>=5.9",
  "certifi",
]

[project.optional-dependencies]
tray = ["pystray>=0.19", "Pillow>=9"]
dev = ["pytest>=7", "ruff>=0.4", "Pillow>=9"]

[project.scripts]
blinkwise = "blinkwise.cli:main"

[project.urls]
Homepage = "https://github.com/yuvalhod/blinkwise"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"blinkwise.ui" = ["static/*.html", "static/*.css", "static/*.txt", "static/fonts/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B"]

[tool.ruff.lint.per-file-ignores]
"src/blinkwise/family/server.py" = ["E501"]   # embedded HTML pages
